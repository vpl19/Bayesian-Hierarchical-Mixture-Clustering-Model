[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bhmm"
description = "Bayesian hierarchical mixture model for subgroup-specific cardiometabolic phenotypes"
version = "0.1.0"
requires-python = ">=3.10"
authors = [{name = "Victor Lhoste"}]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpyro>=0.15",
    "jax>=0.4.25",
    "funsor>=0.4.5",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
dev = [
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/vpl19/Bayesian-Hierarchical-Mixture-Clustering-Model"

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
